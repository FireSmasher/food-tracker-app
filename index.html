<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Tracker</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#111318">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #111318; --card: #1b1e26; --text: #eef0f4; --muted: #8a8f9c;
    --accent: #5ac88c; --border: #2a2e38; --danger: #e0665a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
  header { padding: 16px; text-align: center; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.5px; }
  .panel { display: none; padding: 12px 16px; max-width: 480px; margin: 0 auto; }
  .panel.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.between { justify-content: space-between; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .macros { margin-top: 6px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: #0e1015; color: var(--text); font-size: 15px; margin-bottom: 8px;
  }
  label.field { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
  button.primary { background: var(--accent); color: #0e1015; width: 100%; }
  button.ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  button.ghost.small { padding: 4px 8px; font-size: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .badge { font-size: 10px; background: #3a3220; color: #e0b95a; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .datenav button { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  #totals { display: flex; justify-content: space-between; background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
  .tot { text-align: center; flex: 1; }
  .tot span { display: block; font-size: 18px; font-weight: 700; }
  .tot label { font-size: 11px; color: var(--muted); }
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 12px 0; color: var(--muted); font-size: 12px; background: none; border-radius: 0; }
  .tab.active { color: var(--accent); }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  .target-row { margin-bottom: 10px; }
  .target-row:last-child { margin-bottom: 0; }
  .bar-track { height: 8px; border-radius: 4px; background: #0e1015; overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.2s; }
  .bar-good { background: var(--accent); }
  .bar-under { background: #4a5568; }
  .bar-over { background: var(--danger); }
  .notes { font-style: italic; }
</style>
</head>
<body>

<header><h1>🍽 Food Tracker</h1></header>

<div id="panel-log" class="panel active">
  <div class="datenav">
    <button id="prevDay">‹</button>
    <div class="row" style="gap:6px;">
      <strong id="logDate"></strong>
      <button id="todayBtn" class="ghost small">today</button>
    </div>
    <button id="nextDay">›</button>
  </div>

  <div id="totals"></div>
  <div id="targets" class="card"></div>

  <form id="logForm" class="card">
    <label class="field">Food or recipe name</label>
    <input type="text" id="logName" list="foodList" placeholder="e.g. Chicken breast, raw" autocomplete="off">
    <datalist id="foodList"></datalist>
    <datalist id="recipeList"></datalist>
    <label class="field">Weight (grams)</label>
    <input type="number" id="logGrams" placeholder="e.g. 150" min="1">
    <label class="field">Quantity (optional, e.g. "2 eggs", "1 cup")</label>
    <input type="text" id="logQuantity" placeholder="e.g. 2 eggs" autocomplete="off">
    <label class="field">Notes (optional)</label>
    <input type="text" id="logNotes" placeholder="e.g. pre-workout, felt bloated" autocomplete="off">
    <div class="checkbox-row">
      <input type="checkbox" id="logRestaurant">
      <label for="logRestaurant" class="small">Eaten out / restaurant (applies +15% kcal &amp; fat correction)</label>
    </div>
    <button type="submit" class="primary">Log entry</button>
  </form>

  <h2>Today's entries</h2>
  <div id="logBox"></div>
</div>

<div id="panel-recipes" class="panel">
  <h2>Build a recipe</h2>
  <form id="ingForm" class="card">
    <label class="field">Ingredient (must exist in food library)</label>
    <input type="text" id="ingName" list="foodList" autocomplete="off">
    <label class="field">Weight (grams)</label>
    <input type="number" id="ingGrams" min="1">
    <button type="submit" class="primary">Add ingredient</button>
  </form>
  <div id="recipeIngredients" class="card"></div>
  <form id="recipeForm" class="card">
    <label class="field">Recipe name</label>
    <input type="text" id="recipeName" placeholder="e.g. Sunday chili">
    <button type="submit" class="primary">Save recipe</button>
  </form>

  <h2>Saved recipes</h2>
  <div id="recipesBox"></div>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="log">Log</button>
  <button class="tab" data-tab="recipes">Recipes</button>
</nav>

<script src="./app.js"></script>
</body>
</html>
